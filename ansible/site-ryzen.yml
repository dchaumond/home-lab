---
- name: Configurer le conteneur lxc_storage
  hosts: lxc_storage
  become: true
  roles:
    - role: lxc_storage

- name: Configurer le GPU Passthrough sur Proxmox (Ryzen)
  hosts: proxmox_ryzen
  roles:
    - role: ai  # Exécute uniquement la tâche de GPU Passthrough

- name: Configurer le nœud AI (GPU Passthrough + ROCm/Ollama)
  hosts: lxc_ai
  become: true
  roles:
    - role: ai  # Exécute le passthrough (via delegate_to) + ROCm/Ollama

- name: Configurer le conteneur DevStation
  hosts: lxc_devstation_ryzen
  become: true
  roles:
    - role: dev_station

- name: Configurer le conteneur Apps Runner
  hosts: lxc_apps_runner_ryzen
  become: true
  roles:
    - role: apps_runner

- name: Configurer le conteneur Home Automation
  hosts: lxc_home_automation_ryzen
  become: true
  roles:
    - role: apps_runner
