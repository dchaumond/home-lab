---
# tasks/dev.yml - Installation centralisée des outils pour dev-station
- name: Mettre à jour les paquets et installer les dépendances de base
  ansible.builtin.apt:
    name:
      - git
      - build-essential  # GCC, G++, make
      - python3
      - python3-pip
      - python3-venv
      - default-jdk      # Java
      - net-tools        # netstat
      - lsof
      - strace
      - tcpdump
      - htop
      - glances
      - sysstat
      - ansible
    state: present
    update_cache: yes

- name: Ajouter le dépôt NodeSource pour Node.js 20.x
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Installer Node.js (inclut npm)
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Installer kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ lookup('url', 'https://dl.k8s.io/release/stable.txt') }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: '0755'

- name: Ajouter la clé GPG pour le dépôt HashiCorp
  ansible.builtin.apt_key:
    url: https://apt.releases.hashicorp.com/gpg
    keyring: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    state: present

- name: Ajouter le dépôt HashiCorp pour Terraform
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    state: present
    filename: hashicorp
    update_cache: yes

- name: Installer Terraform et ansible-lint
  ansible.builtin.apt:
    name:
      - terraform
      - ansible-lint
    state: present

- name: Installer Rust (via rustup)
  ansible.builtin.shell: |
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  args:
    creates: "{{ ansible_user_dir }}/.cargo/bin/rustc"
  become: yes
  become_user: dch

- name: Ajouter les binaires Rust au PATH de l'utilisateur dch
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.bashrc"
    line: 'export PATH="$HOME/.cargo/bin:$PATH"'
    regexp: '^export PATH=.*\.cargo/bin.*'
    insertafter: EOF