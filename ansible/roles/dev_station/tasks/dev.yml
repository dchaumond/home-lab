---
# tasks/dev.yml - Installation centralisée des outils pour dev-station
- name: Mettre à jour les paquets et installer les dépendances de base
  ansible.builtin.apt:
    name:
      - git
      - build-essential  # GCC, G++, make
      - python3
      - python3-pip
      - python3-venv
      - default-jdk      # Java
      - net-tools        # netstat
      - lsof
      - strace
      - tcpdump
      - htop
      - glances
      - sysstat
      - sshfs
      - fuse3
      - ansible
      - tmux
      - socat
      - p7zip
      - p7zip-full
    state: present
    update_cache: true

- name: "RTK | Installer via le script officiel"  # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
  args:
    creates: "/home/{{ secrets.user.name }}/.local/bin/rtk"
    executable: /bin/bash
  become: true
  become_user: "{{ secrets.user.name }}"

- name: "RTK | Ajouter ~/.local/bin au PATH"
  ansible.builtin.lineinfile:
    path: "/home/{{ secrets.user.name }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    regexp: '^export PATH=.*\.local/bin.*'
    insertafter: EOF

- name: "OpenCode | Installer via le script officiel"  # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://opencode.ai/install | bash
  args:
    creates: "/home/{{ secrets.user.name }}/.opencode/bin/opencode"
    executable: /bin/bash
  become: true
  become_user: "{{ secrets.user.name }}"

- name: "OpenCode | Ajouter ~/.opencode/bin au PATH"
  ansible.builtin.lineinfile:
    path: "/home/{{ secrets.user.name }}/.bashrc"
    line: 'export PATH="$HOME/.opencode/bin:$PATH"'
    regexp: '^export PATH=.*\.opencode/bin.*'
    insertafter: EOF

- name: "RTK + OpenCode | rtk init -g --opencode"  # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell: |
    set -o pipefail
    yes "" | /home/{{ secrets.user.name }}/.local/bin/rtk init -g --opencode
  args:
    creates: "/home/{{ secrets.user.name }}/.config/opencode/plugins/rtk.ts"
    executable: /bin/bash
  become: true
  become_user: "{{ secrets.user.name }}"

- name: Ajouter le dépôt NodeSource pour Node.js 20.x
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list
    executable: /bin/bash

- name: Installer Node.js (inclut npm)
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Installer kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ lookup('url', 'https://dl.k8s.io/release/stable.txt') }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: '0755'

- name: Ajouter la clé GPG pour le dépôt HashiCorp
  ansible.builtin.apt_key:
    url: https://apt.releases.hashicorp.com/gpg
    keyring: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    state: present

- name: Ajouter le dépôt HashiCorp pour Terraform
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    state: present
    filename: hashicorp
    update_cache: true

- name: Installer Terraform et ansible-lint
  ansible.builtin.apt:
    name:
      - terraform
      - ansible-lint
    state: present

- name: Installer Rust (via rustup)
  ansible.builtin.shell: |
    set -o pipefail
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  args:
    creates: "{{ ansible_user_dir }}/.cargo/bin/rustc"
    executable: /bin/bash
  become: true
  become_user: "{{ secrets.user.name }}"

- name: Ajouter les binaires Rust au PATH de l'utilisateur dch
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.bashrc"
    line: 'export PATH="$HOME/.cargo/bin:$PATH"'
    regexp: '^export PATH=.*\.cargo/bin.*'
    insertafter: EOF
