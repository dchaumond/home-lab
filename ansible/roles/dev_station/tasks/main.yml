---
- name: Installer les dépendances de base
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - ca-certificates
      - gnupg
      - sudo
      - jq
    state: present
    update_cache: yes

- name: Créer le groupe docker
  ansible.builtin.group:
    name: docker
    state: present

- name: Configurer l'utilisateur dch
  ansible.builtin.user:
    name: "{{ secrets.user.name }}"
    shell: /bin/bash
    groups: sudo,docker
    append: yes
    create_home: yes

- name: Définir le mot de passe pour l'utilisateur dch
  ansible.builtin.shell: "echo '{{ secrets.user.name }}:{{ secrets.user.password }}' | chpasswd"
  no_log: true

- name: Installer Docker avec fuse-overlayfs
  ansible.builtin.apt:
    name:
      - docker.io
      - fuse-overlayfs
    state: present
    update_cache: yes

- name: Configurer Docker pour LXC
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "storage-driver": "fuse-overlayfs"
      }
    mode: '0644'

- name: Redémarrer Docker
  ansible.builtin.service:
    name: docker
    state: restarted
    enabled: yes

- name: Vérifier l'installation de Docker
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Afficher la version de Docker
  ansible.builtin.debug:
    var: docker_version.stdout

- name: Installer VSCode
  ansible.builtin.shell: |
    wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > packages.microsoft.gpg
    install -D -o root -g root -m 644 packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.gpg
    echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list
    rm -f packages.microsoft.gpg
    apt update && apt install -y code
  args:
    creates: /usr/bin/code

- name: Inclure les tâches d'installation des outils de développement
  ansible.builtin.include_tasks: dev.yml

- name: Inclure les tâches d'installation RDP
  ansible.builtin.include_tasks: rdp.yml
  tags: rdp

- name: Inclure les tâches de configuration du bureau
  ansible.builtin.include_tasks: desktop.yml
  tags: desktop