---
- name: Déployer dnsmasq.conf.add pour les VIP
  ansible.builtin.raw: |
    cat > /jffs/configs/dnsmasq.conf.add << 'EOF'
    {{ lookup('ansible.builtin.template', 'dnsmasq.conf.add.j2') }}
    EOF
  notify: Redémarrer dnsmasq
  changed_when: true
  tags: dhcp_vip

- name: Déployer hosts.add pour résolution locale sur le routeur
  ansible.builtin.raw: |
    cat > /jffs/configs/hosts.add << 'EOF'
    # VIPs gérés par Ansible
    {% for vip in router.vips %}
    {{ vip.ip }} {{ vip.hostname }}
    {% endfor %}
    EOF
    # Appliquer immédiatement dans /etc/hosts
    {% for vip in router.vips %}
    sed -i "/\b{{ vip.hostname }}\b/d" /etc/hosts 2>/dev/null
    echo "{{ vip.ip }} {{ vip.hostname }}" >> /etc/hosts
    {% endfor %}
  changed_when: true
  tags: dhcp_vip
