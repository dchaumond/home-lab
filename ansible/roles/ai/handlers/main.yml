---
- name: restart ollama
  systemd:
    name: ollama
    state: restarted
    daemon_reload: yes

- name: Reload systemd et redémarrer Ollama
  block:
    - name: Recharger systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Redémarrer Ollama
      ansible.builtin.systemd:
        name: ollama
        state: restarted