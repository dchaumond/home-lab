---
- name: Configurer le GPU Passthrough sur Proxmox (Ryzen)
  block:
    - name: Copier le script de GPU Passthrough
      ansible.builtin.copy:
        src: setup_proxmox.sh
        dest: /tmp/setup_proxmox.sh
        mode: "0755"

    - name: Exécuter le script de GPU Passthrough
      ansible.builtin.command: /tmp/setup_proxmox.sh {{ secrets.ai_node.ct_id }}
  when: "'proxmox_ryzen' in group_names"
  delegate_to: pve-ryzen

- name: Configurer le nœud AI (ROCm + Ollama)
  block:
    - name: Installer les dépendances pour ROCm
      ansible.builtin.apt:
        name:
          - gpg
          - curl
          - software-properties-common
          - apt-transport-https
          - ca-certificates
        state: present
        update_cache: yes

    - name: Ajouter la clé GPG pour ROCm
      ansible.builtin.apt_key:
        url: https://repo.radeon.com/rocm/rocm.gpg.key
        state: present

    - name: Ajouter le dépôt ROCm
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://repo.radeon.com/rocm/apt/{{ rocm_version }} noble main"
        state: present
        filename: rocm
        update_cache: yes

    - name: Installer uniquement rocminfo (sans dépendances conflictuelles)
      ansible.builtin.apt:
        name: rocminfo
        state: present
        update_cache: yes

    - name: Installer les dépendances pour la vérification réseau
      ansible.builtin.apt:
        name:
          - lsof
          - net-tools
        state: present
        update_cache: yes

    - name: Installer zstd (nécessaire pour Ollama)
      ansible.builtin.apt:
        name: zstd
        state: present

    - name: Télécharger et installer Ollama
      ansible.builtin.shell: |
        curl -fsSL https://ollama.com/install.sh | sh
      args:
        creates: /usr/local/bin/ollama
        executable: /bin/bash

    - name: Ajouter l'utilisateur ollama aux groupes video et render
      ansible.builtin.user:
        name: ollama
        groups: video,render
        append: yes

    - name: Activer et démarrer le service Ollama
      ansible.builtin.systemd:
        name: ollama
        enabled: yes
        state: started

    - name: Configurer Ollama pour écouter sur 0.0.0.0
      block:
        - name: Créer le répertoire de surcharge systemd pour Ollama
          ansible.builtin.file:
            path: /etc/systemd/system/ollama.service.d
            state: directory
            mode: "0755"

        - name: Surcharger le service Ollama pour écouter sur 0.0.0.0
          ansible.builtin.copy:
            dest: /etc/systemd/system/ollama.service.d/override.conf
            content: |
              [Service]
              Environment="OLLAMA_HOST=0.0.0.0"
            mode: "0644"
          notify: restart ollama

        - name: Vérifier que Ollama écoute sur 0.0.0.0:11434
          ansible.builtin.shell: |
            netstat -tulnp | grep -E ':11434.*ollama'
          register: ollama_listen_check
          changed_when: false
          failed_when: ollama_listen_check.rc != 0
      when: "'lxc_ai' in group_names"
  when: "'lxc_ai' in group_names"