# roles/minio/tasks/main.yml
---
- name: Télécharger MinIO
  ansible.builtin.get_url:
    url: https://dl.min.io/server/minio/release/linux-amd64/minio
    dest: /usr/local/bin/minio
    mode: '0755'

- name: Créer le groupe MinIO
  ansible.builtin.group:
    name: minio
    state: present
    system: true

- name: Créer l'utilisateur MinIO
  ansible.builtin.user:
    name: "{{ secrets.minio.root_user }}"
    group: minio
    shell: /usr/sbin/nologin
    system: true

- name: Créer le répertoire de données MinIO
  ansible.builtin.file:
    path: "{{ secrets.minio.storage_mount_minio_dest }}"
    state: directory
    owner: "{{ secrets.minio.root_user }}"
    group: minio
    mode: '0750'
    recurse: true

- name: Configurer MinIO comme service
  ansible.builtin.template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Redémarrer MinIO

- name: Recharger systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Activer et démarrer MinIO
  ansible.builtin.service:
    name: minio
    enabled: yes
    state: started


