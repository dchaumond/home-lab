---
- name: Installer sudo
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: yes

- name: Installer Docker et dépendances
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: yes

- name: Créer l'utilisateur docker-admin
  ansible.builtin.user:
    name: "{{ secrets.docker_admin.user }}"
    uid: "{{ secrets.docker_admin.uid }}"
    home: "{{ secrets.docker_admin.home }}"
    groups: "docker,sudo"
    append: yes
    shell: /bin/bash
    create_home: yes
    password: "{{ secrets.docker_admin.password | password_hash('sha512') }}"
    update_password: always
  no_log: true

- name: Créer le répertoire .ssh pour docker-admin
  ansible.builtin.file:
    path: "{{ secrets.docker_admin.home }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ secrets.docker_admin.user }}"
    group: "{{ secrets.docker_admin.user }}"

- name: Ajouter la clé SSH pour docker-admin
  ansible.builtin.copy:
    dest: "{{ secrets.docker_admin.home }}/.ssh/authorized_keys"
    content: "{{ secrets.ssh_key_homelab }}"
    mode: '0600'
    owner: "{{ secrets.docker_admin.user }}"
    group: "{{ secrets.docker_admin.user }}"

- name: Créer le répertoire /etc/sudoers.d
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    mode: '0750'
    owner: root
    group: root

- name: Configurer sudo pour docker-admin (sans mot de passe)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/docker-admin
    content: |
      {{ secrets.docker_admin.user }} ALL=(ALL) NOPASSWD:ALL
    mode: '0440'
    owner: root
    group: root

- name: Créer le répertoire de stockage Docker dans le home de docker-admin
  ansible.builtin.file:
    path: "{{ secrets.ha_runner_ryzen.docker_data_path }}"
    state: directory
    mode: '0755'
    owner: "{{ secrets.docker_admin.user }}"
    group: "{{ secrets.docker_admin.user }}"

- name: Configurer Docker pour autoriser privileged pour le groupe docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "{{ secrets.ha_runner_ryzen.docker_data_path }}",
        "storage-driver": "overlay2",
        "live-restore": true,
        "group": "docker"
      }
    mode: '0644'
  notify: Redémarrer Docker

- name: Activer et démarrer Docker
  ansible.builtin.systemd:
    name: docker
    enabled: yes
    state: started

- name: Vérifier Docker
  ansible.builtin.command: docker info
  register: docker_test
  changed_when: false
  ignore_errors: yes

- name: Configurer les paramètres LXC pour ha-runner-ryzen (mode privileged)
  ansible.builtin.blockinfile:
    path: "/etc/pve/lxc/{{ secrets.ha_runner_ryzen.ct_id }}.conf"
    block: |
      lxc.apparmor.profile: unconfined
      lxc.seccomp.profile:
      lxc.cgroup2.devices.allow: a
      lxc.cap.drop:
      lxc.mount.auto: proc:rw sys:rw
    marker: "# {mark} ANSIBLE MANAGED BLOCK - LXC PRIVILEGED MODE"
    insertafter: EOF
    create: yes
  delegate_to: "{{ secrets.pve_host_ryzen }}"
  become: true

- name: Arrêter le conteneur ha-runner-ryzen
  ansible.builtin.command: "pct stop {{ secrets.ha_runner_ryzen.ct_id }}"
  delegate_to: "{{ secrets.pve_host_ryzen }}"
  become: true

- name: Démarrer le conteneur ha-runner-ryzen
  ansible.builtin.command: "pct start {{ secrets.ha_runner_ryzen.ct_id }}"
  delegate_to: "{{ secrets.pve_host_ryzen }}"
  become: true
