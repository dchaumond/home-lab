---
- name: Installer les dépendances de base
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - ca-certificates
      - gnupg
      - sudo
      - jq
      - net-tools
      - lsof
      - strace
      - tcpdump
    state: present
    update_cache: yes

- name: Inclure le socle Docker (installation + user docker-admin)
  ansible.builtin.include_role:
    name: docker_base

- name: Configurer les paramètres LXC pour ha-runner-ryzen (mode privileged)
  ansible.builtin.blockinfile:
    path: "/etc/pve/lxc/{{ secrets.ha_runner_ryzen.ct_id }}.conf"
    block: |
      lxc.apparmor.profile: unconfined
      lxc.seccomp.profile:
      lxc.cgroup2.devices.allow: a
      lxc.cap.drop:
      lxc.mount.auto: proc:rw sys:rw
    marker: "# {mark} ANSIBLE MANAGED BLOCK - LXC PRIVILEGED MODE"
    insertafter: EOF
    create: yes
  delegate_to: "{{ secrets.pve_host_ryzen }}"
  become: true

- name: Arrêter le conteneur ha-runner-ryzen
  ansible.builtin.command: "pct stop {{ secrets.ha_runner_ryzen.ct_id }}"
  delegate_to: "{{ secrets.pve_host_ryzen }}"
  become: true
  changed_when: true

- name: Démarrer le conteneur ha-runner-ryzen
  ansible.builtin.command: "pct start {{ secrets.ha_runner_ryzen.ct_id }}"
  delegate_to: "{{ secrets.pve_host_ryzen }}"
  become: true
  changed_when: true
